<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | S.EUNY4 Store</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body data-page="login">
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">S.EUNY4 <span>STORE</span></a>

      <div class="header-icons">
        <a href="wishlist.html" class="icon-link" title="المفضلة">
          <i class="fa-regular fa-heart"></i>
        </a>
        <a href="cart.html" class="icon-link" title="السلة">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="cart-count" class="cart-count">0</span>
        </a>
        <a href="login.html" class="icon-link" title="تسجيل الدخول">
          <i class="fa-regular fa-user"></i>
        </a>
      </div>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-box">
      <h1>تسجيل الدخول</h1>

      <form id="login-form">
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" />
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" placeholder="أدخل كلمة المرور" />
        </div>

        <button type="submit" class="auth-btn">تسجيل الدخول</button>
      </form>

      <div style="margin-top: 20px; text-align: center;">
        <p class="text-muted">ليس لديك حساب؟ <a href="index.html">العودة إلى الرئيسية</a></p>
      </div>
    </div>
  </div>

  <script src="products.js"></script>
  <script src="script.js"></script>
</body>
</html>
