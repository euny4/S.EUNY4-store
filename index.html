<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.EUNY4-store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 30px;
        }

        .card {
            background: white;
            width: 250px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px #ccc;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background: #111;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #444;
        }

        footer {
            background: #111;
            color:white;
            text-align:center;
            padding:15px;
        }
    </style>
</head>

<body>

<header>
    <h1>S.EUNY4-store</h1>
    <p>متجرك الإلكتروني الأول</p>
</header>


<section class="products">

    <div class="card">
        <img src="https://via.placeholder.com/250" alt="منتج">
        <h2>منتج رقم 1</h2>
        <p>وصف المنتج</p>
        <p class="price">50 €</p>
        <button>أضف للسلة</button>
    </div>


    <div class="card">
        <img src="https://via.placeholder.com/250" alt="منتج">
        <h2>منتج رقم 2</h2>
        <p>وصف المنتج</p>
        <p class="price">80 €</p>
        <button>أضف للسلة</button>
    </div>


    <div class="card">
        <img src="https://via.placeholder.com/250" alt="منتج">
        <h2>منتج رقم 3</h2>
        <p>وصف المنتج</p>
        <p class="price">120 €</p>
        <button>أضف للسلة</button>
    </div>

</section>


<footer>
    © 2026 S.EUNY4-store جميع الحقوق محفوظة
</footer>


</body>
</html>
